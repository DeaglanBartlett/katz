# Publishes fnprior to PyPI when a GitHub release is published, and to TestPyPI when run by
# hand (Actions > publish > Run workflow). Uses PyPI trusted publishing, so no token is stored:
# the PyPI and TestPyPI projects must list this repository, this workflow (publish.yml) and
# the environment (pypi or testpypi) as a trusted publisher.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the release tag is the package version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' fnprior/prior.py)
          test "${{ github.event.release.tag_name }}" = "v$version"
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fnprior
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fnprior
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
