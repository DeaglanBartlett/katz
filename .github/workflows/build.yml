# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build-linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies (ESR and mpi4py are optional and not needed here)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check fnprior katz
        continue-on-error: false
      - name: Build the distributions and check them for PyPI
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          # the corpora and the katz alias must be in the wheel
          python -m zipfile -l dist/*.whl | grep -E "fnprior/data/PhysicsEquations.csv|fnprior/data/FeynmanEquations.csv|katz/__init__.py"
